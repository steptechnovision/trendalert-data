name: Scrape data

on:
  schedule:
    # Every 20 min, but only during active hours (02:00-18:40 UTC ≈ 7:30 AM-12 AM
    # IST). Skips the dead overnight window when markets are closed & users sleep.
    - cron: '*/20 2-18 * * *'
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Scrape sources -> JSON
        run: npm run scrape

      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --quiet --cached; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +%FT%TZ)"
            git push
          fi
