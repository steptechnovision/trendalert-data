name: Scrape data

on:
  schedule:
    # ┌──────────────────────────────────────────────────────────────────────┐
    # │ HOW TO CHANGE THE REFRESH INTERVAL                                     │
    # │ Edit ONLY the number after */ below, then commit + push this file.     │
    # │   '*/30 2-18 * * *'  → every 30 min                                    │
    # │   '*/20 2-18 * * *'  → every 20 min   (current — recommended)          │
    # │   '*/15 2-18 * * *'  → every 15 min                                    │
    # │   '*/10 2-18 * * *'  → every 10 min   (GitHub min is 5; <15 is jittery │
    # │                        and doubles requests to the source sites)       │
    # │ The `2-18` part = active hours in UTC (≈ 7:30 AM–12 AM IST). Leave it. │
    # └──────────────────────────────────────────────────────────────────────┘
    - cron: '*/20 2-18 * * *'
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the push step below can rebase onto origin/main.
          # (A shallow clone can't rebase, which made re-runs fail.)
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Scrape sources -> JSON
        run: npm run scrape

      - name: Commit updated data
        run: |
          set -u
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/data
          if git diff --quiet --cached; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update $(date -u +%FT%TZ)"

          # Re-running an OLD run checks out that run's (stale) commit, and a
          # scheduled run can also race a concurrent push. Either way a plain
          # `git push` is rejected as non-fast-forward, which used to fail the
          # job. Rebase our data commit onto the current main and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main…"
            git fetch origin main || true
            # Our commit only ever touches docs/data, so on the rare content
            # conflict the freshly-scraped copy is the one we want. During a
            # rebase "theirs" is the commit being replayed — i.e. ours.
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::warning::rebase failed; retrying from a clean fetch"
            fi
            sleep $((attempt * 5))
          done

          echo "::error::could not push data after 3 attempts"
          exit 1

      # Runs last, on purpose: the data is already committed and live by now,
      # so a broken feed turns the build red without ever blocking the healthy
      # feeds from publishing.
      - name: Check feed health
        run: npm run check-health
