name: Scrape data

on:
  schedule:
    # ┌──────────────────────────────────────────────────────────────────────┐
    # │ HOW TO CHANGE THE REFRESH INTERVAL                                     │
    # │ Edit ONLY the number after */ below, then commit + push this file.     │
    # │   '*/30 2-18 * * *'  → every 30 min                                    │
    # │   '*/20 2-18 * * *'  → every 20 min   (current — recommended)          │
    # │   '*/15 2-18 * * *'  → every 15 min                                    │
    # │   '*/10 2-18 * * *'  → every 10 min   (GitHub min is 5; <15 is jittery │
    # │                        and doubles requests to the source sites)       │
    # │ The `2-18` part = active hours in UTC (≈ 7:30 AM–12 AM IST). Leave it. │
    # └──────────────────────────────────────────────────────────────────────┘
    - cron: '*/20 2-18 * * *'
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Scrape sources -> JSON
        run: npm run scrape

      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --quiet --cached; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +%FT%TZ)"
            git push
          fi
